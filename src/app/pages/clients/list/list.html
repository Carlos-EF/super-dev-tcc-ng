<div class="card filters-card">
    <div class="filters">
        <div class="field">
            <label for="f-busca">Buscar</label>
            <div class="control has-prefix">
                <span class="prefix">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </span>
                <input type="search" id="f-busca" placeholder="Nome, código, celular ou e-mail…">
            </div>
        </div>
        <div class="field">
            <label>Tipo do cliente</label>
            <div class="segmented" role="radiogroup" aria-label="Tipo do cliente">
                <input type="radio" name="f-tipo" id="ft-todos" value="" checked>
                <label for="ft-todos">Todos</label>
                <input type="radio" name="f-tipo" id="ft-interessado" value="Interessado">
                <label for="ft-interessado">Interessados</label>
                <input type="radio" name="f-tipo" id="ft-locatario" value="Locatário">
                <label for="ft-locatario">Locatários</label>
                <input type="radio" name="f-tipo" id="ft-proprietario" value="Proprietário">
                <label for="ft-proprietario">Proprietários</label>
            </div>
        </div>
        <div class="field">
            <label for="f-origem">Como nos encontrou</label>
            <div class="select-wrap">
                <select id="f-origem">
                    <option value="">Todas as origens</option>
                    <option>WhatsApp</option>
                    <option>Indicação</option>
                    <option>Instagram</option>
                    <option>Portal imobiliário</option>
                    <option>Placa no imóvel</option>
                </select>
            </div>
        </div>
        <div class="field">
            <label for="f-ordem">Ordenar por</label>
            <div class="select-wrap">
                <select id="f-ordem">
                    <option value="nome-asc">Nome (A–Z)</option>
                    <option value="nome-desc">Nome (Z–A)</option>
                    <option value="codigo">Código</option>
                </select>
            </div>
        </div>
        <button class="btn btn-ghost btn-clear" id="btn-limpar" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
            </svg>
            Limpar
        </button>
    </div>
</div>
