<header class="topbar">

    <a
        class="brand"
        routerLink="/inicio"
        title="Ir para o início"
    >
        <div class="brand-mark">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5 9.5V21h14V9.5" />
                <path d="M9.5 21v-6h5v6" />
            </svg>
        </div>

        <div>
            Gestão Imobiliária
            <small>painel do corretor</small>
        </div>
    </a>

    <div class="topbar-spacer"></div>
    <div class="user-menu">
        <button
            type="button"
            class="avatar-button"
            [attr.aria-expanded]="userMenuOpen()"
            aria-label="Abrir menu do usuário"
            (click)="toggleUserMenu()"
        >
            <span class="avatar">
                {{ userInitials() }}
            </span>

            <svg
                class="avatar-chevron"
                [class.open]="userMenuOpen()"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="m6 9 6 6 6-6" />
            </svg>
        </button>

        @if (userMenuOpen()) {
            <div class="user-dropdown">
                <div class="user-info">
                    <div class="user-info-avatar">
                        {{ userInitials() }}
                    </div>

                    <div class="user-info-data">
                        <strong>
                            {{ userName() }}
                        </strong>

                        <span>
                            {{ userEmail() }}
                        </span>
                    </div>
                </div>

                <div class="dropdown-divider"></div>
                <button
                    type="button"
                    class="dropdown-item logout-item"
                    (click)="logout()"
                >
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" />
                        <path d="M16 16l4-4-4-4" />
                        <path d="M20 12H9" />
                    </svg>
                    <span>Sair</span>
                </button>
            </div>
        }
    </div>
</header>
